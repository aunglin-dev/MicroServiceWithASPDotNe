version: "3.9"
services:
  catalogdb:
    image: postgres
  
  basketdb:
    image: postgres
    
  distributedcache:
    image: redis
  
  catalog.api:
    image: ${DOCKER_REGISTRY-}catalogapi
    build:
      context: .
      dockerfile: src/Services/Catalog/Catalog.API/Dockerfile

  basket.api:
    image: ${DOCKER_REGISTRY-}basketapi
    build:
      context: .
      dockerfile: src/Services/Basket/Basket.API/Dockerfile

  disount.grpc:
    image: ${DOCKER_REGISTRY-}disountgrpc
    build:
      context: .
      dockerfile: src/Services/Disount.Grpc/Dockerfile

volumes:
  postgres_catalog:
  postgres_basket:

    



